<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10161c">
<title>TRU WIND</title>
<style>
:root{--bg:#10161c;--ink:#e7f1f6;--dim:#9aafbc;--line:#24323c;--sky:#9fd0ea;--card:#18242c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--sky)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c1216;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--sky);color:#10161c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--sky);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>WIND</span></h1><p class="sub">Beaufort, from what you can see. Not a forecast.</p></header>
<div class="bar"><input id="q" placeholder="force, gale, mph…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const B=[
[0,"Calm","under 1 kt","Smoke rises vertically. Sea like a mirror."],
[1,"Light air","1–3 kt","Direction by smoke, not by vanes. Ripples, no foam."],
[2,"Light breeze","4–6 kt","Felt on the face. Leaves rustle. Vane moves."],
[3,"Gentle breeze","7–10 kt","Leaves and small twigs in constant motion. Light flag extends."],
[4,"Moderate breeze","11–16 kt","Dust and loose paper rise. Small branches move."],
[5,"Fresh breeze","17–21 kt","Small trees sway. Moderate waves, longer form."],
[6,"Strong breeze","22–27 kt","Large branches move. Whistling in wires. Rough sea."],
[7,"Near gale","28–33 kt","Whole trees move. Walking against it is hard."],
[8,"Gale","34–40 kt","Twigs break. Very rough to high sea."],
[9,"Strong gale","41–47 kt","Slight structural damage. High sea."],
[10,"Storm","48–55 kt","Trees uprooted. Very high sea."],
[11,"Violent storm","56–63 kt","Widespread damage."],
[12,"Hurricane","64 kt and over","Phenomenal sea. Devastation."]
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(f,name,kt,d){
  return `<article class="card"><div class="k">FORCE ${f}</div><div class="big">${esc(name)}</div><div>${esc(kt)}. ${esc(d)} Knots × 1.15 is about mph.</div><div class="src">Beaufort. Knot bands from the Met Office scale. Land signs from the NOAA JetStream table where it overlaps, else the same scale.</div></article>`;
}
function show(list){document.getElementById("out").innerHTML=list.map(x=>card(...x)).join("");}
function search(q){
  q=(q||"").trim().toLowerCase();
  if(!q){show(B);return;}
  const n=parseFloat(q);
  let hits=B.filter(x=>String(x[0])===q||x[1].toLowerCase().includes(q)||x[3].toLowerCase().includes(q));
  if(!isNaN(n)){
    hits=B.filter(x=>{
      if(x[0]===12) return n>=64;
      const m=x[2].match(/(\d+)[–-](\d+)/);
      return m && n>=+m[1] && n<=+m[2];
    });
    if(!hits.length && n<1) hits=[B[0]];
  }
  document.getElementById("out").innerHTML=hits.length?hits.map(x=>card(...x)).join(""):`<article class="card"><div class="k">GAP</div><div class="big">No force</div><div>Type 0–12, a name, or a knot number.</div></article>`;
}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(B);
</script>
</body>
</html>
